services:
  dashboard:
    image: nginx:alpine
    container_name: cs2-tv-dashboard
    restart: unless-stopped
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  streamer:
    image: ghcr.io/zozman/stream-webpage-container:latest
    container_name: cs2-tv-streamer
    restart: unless-stopped
    depends_on:
      - dashboard
      - mediamtx
    environment:
      WEBPAGE_URL: "http://dashboard/"
      RTMP_URL: "rtmp://mediamtx:1935/live/stream"
      RESOLUTION: "1080p"
      FRAMERATE: "30"

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cs2-tv-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
